<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Package - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: var(--bg-light);">

    <nav class="navbar" style="background-color: var(--primary-color); position: sticky;">
        <div class="container nav-container" style="padding: 15px 0;">
            <a href="admin_dashboard.html" class="logo" style="color: var(--white);">
                <i class="fa-solid fa-plane-departure" style="color: var(--secondary-color);"></i> Wander<span style="color: var(--white);">Admin</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" target="_blank" style="color: #cbd5e1;"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Site</a></li>
                <li><a href="index.html" class="btn btn-danger btn-sm" style="padding: 8px 15px;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-layout container" style="margin-top: 30px; display: flex; gap: 30px;">
        <div class="sidebar" style="border-radius: var(--border-radius); width: 250px; background: var(--white); box-shadow: var(--shadow); padding: 20px 0; align-self: start;">
            <div class="sidebar-menu" style="display: flex; flex-direction: column;">
                <a href="admin_dashboard.html" style="padding: 15px 25px; color: var(--text-dark); font-weight: 500;"><i class="fa-solid fa-gauge" style="width: 25px;"></i> Dashboard</a>
                <a href="admin_packages.html" style="padding: 15px 25px; color: var(--secondary-color); font-weight: 500; background: var(--bg-light); border-left: 3px solid var(--secondary-color);"><i class="fa-solid fa-box" style="width: 25px;"></i> Manage Packages</a>
                <a href="admin_bookings.html" style="padding: 15px 25px; color: var(--text-dark); font-weight: 500;"><i class="fa-solid fa-calendar-check" style="width: 25px;"></i> All Bookings</a>
            </div>
        </div>
        
        <div class="dashboard-content" style="flex: 1;">
            <div style="background-color: var(--white); padding: 30px; border-radius: var(--border-radius); box-shadow: var(--shadow); max-width: 800px;">
                <h2 style="color: var(--primary-color); margin-bottom: 30px;">Add New Package (Test Mode)</h2>
                
                <form onsubmit="simulateAddPackage(event)">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Package Title</label>
                        <input type="text" name="title" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;" required>
                    </div>
                    
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <div style="flex: 1;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 500;">Price ($)</label>
                            <input type="number" name="price" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;" required>
                        </div>
                        <div style="flex: 1;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 500;">Duration</label>
                            <input type="text" name="duration" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;" required>
                        </div>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Location</label>
                        <input type="text" name="location" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;" required>
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Image URL</label>
                        <input type="url" name="image" class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
                    </div>
                    
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Description</label>
                        <textarea class="form-control" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; min-height: 120px;" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Save Package</button>
                    <a href="admin_packages.html" class="btn btn-outline" style="margin-left: 10px; padding: 12px 25px; border-radius: 50px; border: 2px solid var(--secondary-color); color: var(--secondary-color); display: inline-block;">Cancel</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        function simulateAddPackage(e) {
            e.preventDefault();
            
            const title = document.querySelector('input[name="title"]').value;
            const price = document.querySelector('input[name="price"]').value;
            const location = document.querySelector('input[name="location"]').value;
            let image = document.querySelector('input[name="image"]').value;
            
            if(!image) image = 'https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=800&q=80';
            
            const newPkg = { title, price, location, image };
            let pkgs = JSON.parse(localStorage.getItem('mockPackages')) || [];
            pkgs.push(newPkg);
            localStorage.setItem('mockPackages', JSON.stringify(pkgs));
            
            alert("Package saved successfully! Returning to packages list.");
            window.location.href = "admin_packages.html";
        }
    </script>
</body>
</html>
