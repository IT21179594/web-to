<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Packages - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: var(--bg-light);">

    <nav class="navbar" style="background-color: var(--primary-color); position: sticky;">
        <div class="container nav-container" style="padding: 15px 0;">
            <a href="admin_dashboard.html" class="logo" style="color: var(--white);">
                <i class="fa-solid fa-plane-departure" style="color: var(--secondary-color);"></i> Wander<span style="color: var(--white);">Admin</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" target="_blank" style="color: #cbd5e1;"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Site</a></li>
                <li><a href="index.html" class="btn btn-danger btn-sm" style="padding: 8px 15px;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-layout container" style="margin-top: 30px; display: flex; gap: 30px;">
        <div class="sidebar" style="border-radius: var(--border-radius); width: 250px; background: var(--white); box-shadow: var(--shadow); padding: 20px 0; align-self: start;">
            <div class="sidebar-menu" style="display: flex; flex-direction: column;">
                <a href="admin_dashboard.html" style="padding: 15px 25px; color: var(--text-dark); font-weight: 500;"><i class="fa-solid fa-gauge" style="width: 25px;"></i> Dashboard</a>
                <a href="admin_packages.html" style="padding: 15px 25px; color: var(--secondary-color); font-weight: 500; background: var(--bg-light); border-left: 3px solid var(--secondary-color);"><i class="fa-solid fa-box" style="width: 25px;"></i> Manage Packages</a>
                <a href="admin_bookings.html" style="padding: 15px 25px; color: var(--text-dark); font-weight: 500;"><i class="fa-solid fa-calendar-check" style="width: 25px;"></i> All Bookings</a>
            </div>
        </div>
        
        <div class="dashboard-content" style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2 style="color: var(--primary-color);">Manage Packages (Test Mode)</h2>
                <a href="admin_add_package.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add New Package</a>
            </div>
            
            <div style="background: var(--white); border-radius: var(--border-radius); box-shadow: var(--shadow); overflow: hidden;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="background: var(--primary-color); color: var(--white);">
                            <th style="padding: 15px;">Image</th>
                            <th style="padding: 15px;">Title</th>
                            <th style="padding: 15px;">Location</th>
                            <th style="padding: 15px;">Price</th>
                            <th style="padding: 15px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom: 1px solid #e2e8f0;">
                            <td style="padding: 15px;"><img src="https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=800&q=80" style="width: 60px; height: 40px; border-radius: 4px; object-fit: cover;"></td>
                            <td style="padding: 15px;">Tropical Paradise Getaway</td>
                            <td style="padding: 15px;">Maldives</td>
                            <td style="padding: 15px;">$899.00</td>
                            <td style="padding: 15px;">
                                <button class="btn btn-outline" style="padding: 5px 10px; border-color: var(--secondary-color); color: var(--secondary-color);"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-danger" style="padding: 5px 10px;"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 15px;"><img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=800&q=80" style="width: 60px; height: 40px; border-radius: 4px; object-fit: cover;"></td>
                            <td style="padding: 15px;">European Heritage Tour</td>
                            <td style="padding: 15px;">France & Italy</td>
                            <td style="padding: 15px;">$1,499.00</td>
                            <td style="padding: 15px;">
                                <button class="btn btn-outline" style="padding: 5px 10px; border-color: var(--secondary-color); color: var(--secondary-color);"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-danger" style="padding: 5px 10px;"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.querySelector('tbody');
            let pkgs = JSON.parse(localStorage.getItem('mockPackages')) || [];
            pkgs.forEach(pkg => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="padding: 15px;"><img src="${pkg.image}" style="width: 60px; height: 40px; border-radius: 4px; object-fit: cover;"></td>
                    <td style="padding: 15px;">${pkg.title}</td>
                    <td style="padding: 15px;">${pkg.location}</td>
                    <td style="padding: 15px;">$${parseFloat(pkg.price).toFixed(2)}</td>
                    <td style="padding: 15px;">
                        <button class="btn btn-outline" style="padding: 5px 10px; border-color: var(--secondary-color); color: var(--secondary-color);"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-danger" style="padding: 5px 10px;"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
